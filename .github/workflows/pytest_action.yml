name: Testing with Pytest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src/ test/ --max-line-length=100 --ignore=E203,W503
        continue-on-error: false

      - name: Run tests with coverage
        run: |
          pytest test/test_pytest.py \
            --junitxml=pytest-report.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
        continue-on-error: false

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            pytest-report.xml
            coverage.xml

      - name: Notify on success
        if: success()
        run: echo "All checks passed. Lint clean, tests passed, coverage report generated."

      - name: Notify on failure
        if: failure()
        run: echo "Pipeline failed. Check lint errors or test failures above."
